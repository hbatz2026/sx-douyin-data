<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山西电信抖本实时数据大屏</title>
<style>
:root{
  --bg:#0a0f1a; --panel:#121826; --panel2:#1a2332; --line:#2a3a4e;
  --blue:#0066cc; --blue2:#1e90ff; --cyan:#00d4ff; --gold:#f0b429;
  --red:#e63946; --green:#2ea043; --text:#e6edf3; --sub:#7a8899; --dim:#4a5a6e;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Microsoft YaHei",sans-serif;min-height:100vh;overflow-x:hidden}
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999}
#lock .box{background:var(--panel);padding:36px;border-radius:10px;text-align:center;border:1px solid var(--line)}
#lock h2{color:var(--blue2);margin-bottom:14px;font-size:20px;letter-spacing:2px}
#lock input{padding:10px 14px;width:240px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px;text-align:center}
#lock .btn{margin-top:14px;padding:9px 30px;background:var(--blue);color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer}
#lock .err{color:var(--red);margin-top:8px;font-size:12px;display:none}
#dash{display:none}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 28px;background:linear-gradient(90deg,var(--blue),#003d7a);border-bottom:2px solid var(--blue2)}
.header h1{font-size:20px;letter-spacing:3px;font-weight:600}
.header .meta{font-size:12px;color:#b0c8e8;text-align:right}
.header .meta b{color:#fff;font-size:14px}
.summary-section{padding:18px 28px 14px}
.summary-section .title-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.summary-section .title-row h2{font-size:15px;color:var(--blue2);border-left:3px solid var(--blue2);padding-left:8px}
.summary-section .title-row span{font-size:11px;color:var(--sub)}
.kpi-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:10px}
/* 实时/自然月分组样式 */
.kpi-group{margin-bottom:16px}
.kpi-group-title{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--blue2);border-left:3px solid var(--blue2);padding-left:8px;margin-bottom:10px;font-weight:600}
.kpi-group-title .badge{font-size:10px;font-weight:700;padding:2px 10px;border-radius:10px;color:#fff;letter-spacing:1px}
.badge.rt{background:linear-gradient(90deg,#e63946,#f0b429);box-shadow:0 0 10px rgba(230,57,70,.55);animation:pulse 2s infinite}
.badge.mo{background:var(--blue);color:#fff}
@keyframes pulse{0%,100%{box-shadow:0 0 6px rgba(230,57,70,.4)}50%{box-shadow:0 0 16px rgba(230,57,70,.8)}}
.kpi-group .kpi-grid{grid-template-columns:repeat(6,1fr)}
.kpi-group:nth-child(2) .kpi-grid{grid-template-columns:repeat(9,1fr)}
.rt-group .kpi-card{border:1px solid rgba(240,180,41,.35);background:linear-gradient(180deg,rgba(240,180,41,.08),var(--panel));box-shadow:inset 0 0 12px rgba(240,180,41,.05)}
.rt-group .kpi-card::before{background:linear-gradient(90deg,#f0b429,#e63946)}
.rt-group .kpi-card .k-label{color:var(--gold)}
.summary-section .sub-hint{font-size:10px;color:var(--dim);margin-bottom:4px}
.kpi-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 10px;text-align:center;position:relative;overflow:hidden;transition:border-color .3s}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--blue2)}
.kpi-card .k-label{font-size:11px;color:var(--sub);line-height:1.3;margin-bottom:6px}
.kpi-card .k-val{font-size:24px;font-weight:700;color:#fff;letter-spacing:1px}
.kpi-card .k-val.blue{color:var(--blue2)} .kpi-card .k-val.gold{color:var(--gold)} .kpi-card .k-val.cyan{color:var(--cyan)} .kpi-card .k-val.green{color:var(--green)} .kpi-card .k-val.red{color:var(--red)}
.kpi-card .k-unit{font-size:11px;color:var(--sub);margin-top:2px}
.region-section{padding:0 28px 14px}
.region-section .title-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.region-section .title-row h2{font-size:15px;color:var(--blue2);border-left:3px solid var(--blue2);padding-left:8px}
.region-section .title-row span{font-size:11px;color:var(--sub)}
.region-tabs{display:flex;gap:6px;margin-bottom:10px}
.region-tabs button{padding:5px 14px;font-size:12px;background:var(--panel);border:1px solid var(--line);color:var(--sub);border-radius:4px;cursor:pointer;transition:.2s}
.region-tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue2)}
.region-tabs button:hover{border-color:var(--blue2)}
.region-chart-wrap{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:10px;position:relative}
#regionCanvas{display:block;width:100%}
.region-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.region-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;transition:border-color .3s}
.region-card:hover{border-color:var(--blue2)}
.region-card.has-live{border-color:rgba(0,102,204,.4)}
.region-card .r-name{font-size:13px;font-weight:600;color:#fff;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.region-card .r-name .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.region-card.has-live .r-name .dot{background:var(--green)}
.region-card .r-data{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:11px}
.region-card .r-data .d{display:flex;flex-direction:column}
.region-card .r-data .d .dl{color:var(--sub);font-size:10px}
.region-card .r-data .d .dv{color:#fff;font-weight:600}
.region-card .r-data .d .dv.red{color:var(--red)} .region-card .r-data .d .dv.gold{color:var(--gold)} .region-card .r-data .d .dv.blue{color:var(--blue2)}
.region-card .r-empty{font-size:11px;color:var(--dim)}
.qa-section{padding:0 28px 14px}
.qa-section .title-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.qa-section .title-row h2{font-size:15px;color:var(--blue2);border-left:3px solid var(--blue2);padding-left:8px}
.qa-section .title-row span{font-size:11px;color:var(--sub)}
.qa-row{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.room-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:360px;overflow-y:auto}
.room-card{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:10px;cursor:pointer;transition:.2s}
.room-card:hover{border-color:var(--blue2)}
.room-card.active{border-color:var(--blue2);background:rgba(0,102,204,.08)}
.room-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.room-card .name{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.room-card .tag{font-size:9px;padding:1px 5px;border-radius:8px;white-space:nowrap}
.room-card .tag.on{background:rgba(46,160,67,.2);color:var(--green)}
.room-card .tag.off{background:rgba(122,136,153,.2);color:var(--sub)}
.room-card .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;font-size:10px}
.room-card .metrics .m{display:flex;flex-direction:column}
.room-card .metrics .m .ml{color:var(--sub);font-size:9px}
.room-card .metrics .m .mv{color:#fff;font-weight:600}
.room-card .warn{font-size:9px;color:var(--gold);margin-top:3px}
.alert-list{display:flex;flex-direction:column;gap:6px;max-height:360px;overflow-y:auto}
.alert{display:flex;gap:6px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:7px;border-left:3px solid var(--sub)}
.alert.sev{border-left-color:var(--red)} .alert.warn{border-left-color:var(--gold)} .alert.info{border-left-color:var(--blue2)}
.alert .lv{font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;white-space:nowrap}
.alert.sev .lv{background:var(--red);color:#fff}
.alert.warn .lv{background:var(--gold);color:#000}
.alert.info .lv{background:var(--blue2);color:#fff}
.alert .desc{font-size:11px}
.alert .desc b{font-size:12px}
.alert .time{font-size:9px;color:var(--sub);margin-top:1px}
.empty{color:var(--sub);text-align:center;padding:20px;font-size:12px}
footer{padding:10px;text-align:center;color:var(--dim);font-size:10px}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--panel)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--blue2)}
</style>
</head>
<body>
<div id="lock">
  <div class="box">
    <h2>山西电信直播数据大屏</h2>
    <input id="pwd" type="password" placeholder="请输入访问密码" autocomplete="off">
    <div><button class="btn" onclick="checkPwd()">进入</button></div>
    <div class="err" id="err">密码错误，请重试</div>
  </div>
</div>
<div id="dash">
  <div class="header">
    <h1>山西电信 · 抖本实时数据大屏</h1>
    <div class="meta">数据截止 <b id="updateTime">--</b> · 下次刷新 <span id="countdown">30</span>s</div>
  </div>
  <div class="summary-section">
    <div class="title-row"><h2>经营数据总览</h2><span>实时(今日) 与 自然月(8月1日至今) 双口径 · 实时数据红色高亮</span></div>
    <div class="kpi-group rt-group" id="kpiGridRt"></div>
    <div class="kpi-group" id="kpiGridMo"></div>
  </div>
  <div class="region-section">
    <div class="title-row"><h2>分地市数据</h2><span>各地市经营指标与直播分布</span></div>
    <div class="region-tabs" id="regionTabs">
      <button class="active" data-metric="pay_gmv">成交金额</button>
      <button data-metric="poi_num">门店数</button>
      <button data-metric="active_poi_cnt">动销门店</button>
      <button data-metric="active_poi_ratio">动销率</button>
      <button data-metric="pay_cert_cnt">成交券数</button>
      <button data-metric="verify_gmv">核销金额</button>
      <button data-metric="verify_cert_cnt">核销券数</button>
      <button data-metric="pay_user_cnt">成交用户</button>
    </div>
    <div class="region-chart-wrap">
      <canvas id="regionCanvas" width="1200" height="300"></canvas>
    </div>
    <div class="region-grid" id="regionGrid"></div>
  </div>
  <div class="qa-section">
    <div class="title-row"><h2>直播质检</h2><span>在播直播间巡检与告警</span></div>
    <div class="qa-row">
      <div><div class="room-list" id="roomList"></div></div>
      <div><div class="alert-list" id="alertList"></div></div>
    </div>
  </div>
  <footer>数据来源：生意经(life-data.cn) · 内部数据请勿外传 · 每30秒自动刷新</footer>
</div>
<script>
const PASS="sxtel2026";
function checkPwd(){const v=document.getElementById('pwd').value;if(v===PASS){document.getElementById('lock').style.display='none';document.getElementById('dash').style.display='block';start();}else{document.getElementById('err').style.display='block';}}
document.getElementById('pwd').addEventListener('keydown',e=>{if(e.key==='Enter')checkPwd();});
const DATA_URL=location.pathname.includes('/dash/')?'data.json':'data/data.json';
const QA_URL=location.pathname.includes('/dash/')?'qa.json':'data/qa.json';
const CITIES=['太原','晋中','大同','阳泉','长治','晋城','朔州','忻州','吕梁','临汾','运城'];
const METRIC_LABELS={
  pay_gmv:'成交金额',poi_num:'门店数',active_poi_cnt:'动销门店数',active_poi_ratio:'动销率(%)',
  pay_cert_cnt:'成交券数',verify_gmv:'核销金额',verify_cert_cnt:'核销券数',pay_user_cnt:'成交用户数',
  refund_gmv:'退款金额',refund_cert_cnt:'退款券数'
};
let RAW_DATA=null,alertCount=0,countdownVal=30,currentMetric='pay_gmv';
function num(v){const n=parseFloat(v);return isNaN(n)?0:n;}
function fmt(v){if(v>=10000)return(v/10000).toFixed(1)+'万';return Math.round(v*100)/100;}
function fmtMoney(v){if(v>=10000)return(v/10000).toFixed(2)+'万';return v.toFixed(2);}
function moneyUnit(v){return v>=10000?'万元':'元';}
function kv(ki,key){if(!Array.isArray(ki))return 0;const item=ki.find(i=>i&&i.key===key);return item?num(item.value):0;}
function gmv(ki){return kv(ki,'PayGmv');}
function extractCity(nickname){if(!nickname)return'未知';for(const c of CITIES){if(nickname.includes(c))return c;}return'其他';}
async function loadData(){try{const res=await fetch(DATA_URL+'?t='+Date.now());const d=await res.json();RAW_DATA=d;render(d);}catch(e){document.getElementById('updateTime').textContent='加载失败';}}
async function loadAlerts(){try{const res=await fetch(QA_URL+'?t='+Date.now());const d=await res.json();renderAlerts(d.alerts||[]);}catch(e){}}
function render(d){
  document.getElementById('updateTime').textContent=d.ts||'--';
  const rooms=d.rooms||[];const summary=d.summary||{};
  const cities=d.cities||{};
  renderSummary(summary,rooms);
  renderRegions(rooms,cities);
  renderRooms(rooms);
}
function renderSummary(s,rooms){
  // 首页实时(今日口径, 不覆盖)
  const payGmv=s.pay_gmv||0,payCertCnt=s.pay_cert_cnt||0;
  const verifyGmv=s.verify_gmv||0,verifyCertCnt=s.verify_cert_cnt||0;
  const refundGmv=s.refund_gmv||0,refundCertCnt=s.refund_cert_cnt||0;
  const productShowUv=s.product_show_uv||0;
  const livingRoomCnt=s.living_room_cnt||rooms.length;
  const liveShowUv=s.live_show_uv_total||rooms.reduce((a,r)=>a+(r.meta?.live_show_uv_td||0),0);
  // 自然月(经营页面, month_ 前缀)
  const poiNum=s.poi_num||0,activePoi=s.active_poi_cnt||0,activeRatio=s.active_poi_ratio||0;
  const payGmvAvg=s.pay_gmv_avg||0,verifyGmvAvg=s.verify_gmv_avg||0;
  const mPayGmv=s.month_pay_gmv||0,mPayCert=s.month_pay_cert_cnt||0;
  const mVerifyGmv=s.month_verify_gmv||0,mVerifyCert=s.month_verify_cert_cnt||0;
  const mRefundGmv=s.month_refund_gmv||0,mRefundCert=s.month_refund_cert_cnt||0;
  const mPayUser=s.month_pay_user_cnt||0,mVerifyUser=s.month_verify_user_cnt||0;
  // 实时数据(6项) - 醒目红色
  const rtKpis=[
    {label:'成交金额',val:fmtMoney(payGmv),cls:'gold',unit:moneyUnit(payGmv)},
    {label:'成交券数',val:fmt(payCertCnt),cls:'gold'},
    {label:'退款金额',val:fmtMoney(refundGmv),cls:'red',unit:moneyUnit(refundGmv)},
    {label:'核销金额',val:fmtMoney(verifyGmv),cls:'green',unit:moneyUnit(verifyGmv)},
    {label:'核销券数',val:fmt(verifyCertCnt),cls:'green'},
    {label:'商品访问人数',val:fmt(productShowUv),cls:'cyan'},
  ];
  // 自然月数据(9格)
  const moKpis=[
    {label:'门店总数',val:fmt(poiNum),cls:''},
    {label:'动销门店数',val:fmt(activePoi),cls:'green'},
    {label:'动销率',val:activeRatio.toFixed(2)+'%',cls:'gold'},
    {label:'日店均成交',val:fmtMoney(payGmvAvg),cls:'blue',unit:'元'},
    {label:'日店均核销',val:fmtMoney(verifyGmvAvg),cls:'cyan',unit:'元'},
    {label:'意向成交金额',val:fmtMoney(mPayGmv),cls:'blue',unit:moneyUnit(mPayGmv)},
    {label:'意向成交券数',val:fmt(mPayCert),cls:'blue'},
    {label:'核销金额',val:fmtMoney(mVerifyGmv),cls:'',unit:moneyUnit(mVerifyGmv)},
    {label:'核销券数',val:fmt(mVerifyCert),cls:''},
  ];
  const groupHtml=(title,badge,badgeCls,items)=>`
    <div class="kpi-group-title"><span class="badge ${badgeCls}">${badge}</span>${title}</div>
    <div class="kpi-grid">${items.map(k=>
      `<div class="kpi-card"><div class="k-label">${k.label}</div><div class="k-val ${k.cls}">${k.val}</div><div class="k-unit">${k.unit||''}</div></div>`
    ).join('')}</div>`;
  document.getElementById('kpiGridRt').innerHTML=groupHtml('今日实时数据', '实时', 'rt', rtKpis);
  document.getElementById('kpiGridMo').innerHTML=groupHtml('自然月数据（8月1日至今）','自然月','mo',moKpis);
}
function drawRegionChart(cities,metric){
  const canvas=document.getElementById('regionCanvas');
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const cssW=canvas.parentElement.clientWidth-32;
  canvas.style.width=cssW+'px';
  canvas.width=cssW*dpr;
  canvas.height=300*dpr;
  ctx.scale(dpr,dpr);
  const W=cssW,H=300;
  ctx.clearRect(0,0,W,H);
  const label=METRIC_LABELS[metric]||metric;
  const data=CITIES.map(c=>{const cd=cities[c]||{};return {name:c,val:num(cd[metric]||0),live:cd.poi_num?true:false};});
  const maxVal=Math.max(...data.map(d=>d.val),0.01);
  const barW=Math.min(80,(W-60)/CITIES.length-12);
  const gap=(W-60)/CITIES.length;
  const baseY=H-50;
  const chartH=baseY-30;
  // title
  ctx.fillStyle='#1e90ff';ctx.font='13px "Microsoft YaHei"';ctx.textAlign='left';
  ctx.fillText(label+' - 各地市对比',16,22);
  // Y axis grid lines
  ctx.strokeStyle='#2a3a4e';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=30+chartH*i/4;
    ctx.beginPath();ctx.moveTo(50,y);ctx.lineTo(W-10,y);ctx.stroke();
    const gridVal=maxVal*(1-i/4);
    ctx.fillStyle='#7a8899';ctx.font='10px "Microsoft YaHei"';ctx.textAlign='right';
    ctx.fillText(fmtMoney(gridVal),45,y+3);
  }
  // bars
  data.forEach((d,i)=>{
    const x=55+i*gap+gap/2-barW/2;
    const h=maxVal>0?Math.max(d.val/maxVal*chartH,0):0;
    const y=baseY-h;
    if(d.val>0){
      const grad=ctx.createLinearGradient(0,y,0,baseY);
      grad.addColorStop(0,'#1e90ff');
      grad.addColorStop(1,'#0066cc');
      ctx.fillStyle=grad;
    }else{
      ctx.fillStyle='#2a3a4e';
    }
    ctx.fillRect(x,y,barW,Math.max(h,1));
    // value label on top
    if(d.val>0){
      ctx.fillStyle='#e6edf3';ctx.font='10px "Microsoft YaHei"';ctx.textAlign='center';
      const valStr=metric.includes('gmv')?fmtMoney(d.val):fmt(d.val);
      ctx.fillText(valStr,x+barW/2,y-4);
    }
    // city name below
    ctx.fillStyle=d.live?'#e6edf3':'#7a8899';ctx.font='11px "Microsoft YaHei"';ctx.textAlign='center';
    ctx.fillText(d.name,x+barW/2,baseY+18);
    // live indicator
    if(d.live){
      ctx.fillStyle='#2ea043';
      ctx.beginPath();ctx.arc(x+barW/2-24,baseY+34,3,0,Math.PI*2);ctx.fill();
    }
  });
}
function renderRegions(rooms,cities){
  const hasCityData=cities&&Object.keys(cities).length>0;
  // draw chart
  if(hasCityData){
    drawRegionChart(cities,currentMetric);
  }else{
    const canvas=document.getElementById('regionCanvas');
    const ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#7a8899';ctx.font='13px "Microsoft YaHei"';ctx.textAlign='center';
    ctx.fillText('分地市数据采集中，请等待下一轮采集完成...',canvas.width/2,150);
  }
  // region cards: combine city data + live room info
  const regionMap={};
  CITIES.forEach(c=>regionMap[c]={rooms:[],hasLive:false,cityData:cities[c]||{}});
  rooms.forEach(r=>{const city=extractCity(r.meta?.nickname);if(!regionMap[city])regionMap[city]={rooms:[],hasLive:false,cityData:{}};regionMap[city].rooms.push(r);regionMap[city].hasLive=true;});
  document.getElementById('regionGrid').innerHTML=CITIES.map(city=>{
    const rd=regionMap[city];const liveCnt=rd.rooms.length;
    const cd=rd.cityData||{};
    const poiNum=cd.poi_num||0;
    if(poiNum>0){
      // has city-level data from collect
      let totalGmv=0,totalOrders=0,totalWatch=0,totalOnline=0;
      rd.rooms.forEach(r=>{const ki=r.live?.key_index||[];totalGmv+=gmv(ki);totalOrders+=kv(ki,'PayOrderCnt');totalWatch+=kv(ki,'LiveServerWatchUcnt');totalOnline+=kv(ki,'CurrentUserCnt');});
      return `<div class="region-card has-live"><div class="r-name"><span class="dot"></span>${city} <span style="font-size:10px;color:var(--sub);font-weight:400">(${poiNum}店${liveCnt>0?'/'+liveCnt+'间':''})</span></div><div class="r-data"><div class="d"><span class="dl">成交金额</span><span class="dv red">¥${fmtMoney(cd.pay_gmv||0)}</span></div><div class="d"><span class="dl">成交券数</span><span class="dv gold">${cd.pay_cert_cnt||0}</span></div><div class="d"><span class="dl">核销金额</span><span class="dv green">¥${fmtMoney(cd.verify_gmv||0)}</span></div><div class="d"><span class="dl">核销券数</span><span class="dv">${cd.verify_cert_cnt||0}</span></div><div class="d"><span class="dl">动销门店</span><span class="dv blue">${cd.active_poi_cnt||0}</span></div><div class="d"><span class="dl">动销率</span><span class="dv">${(cd.active_poi_ratio||0).toFixed(1)}%</span></div></div></div>`;
    }
    if(liveCnt===0){return `<div class="region-card"><div class="r-name"><span class="dot"></span>${city}</div><div class="r-empty">暂无在播</div></div>`;}
    let totalGmv=0,totalOrders=0,totalWatch=0,totalOnline=0;
    rd.rooms.forEach(r=>{const ki=r.live?.key_index||[];totalGmv+=gmv(ki);totalOrders+=kv(ki,'PayOrderCnt');totalWatch+=kv(ki,'LiveServerWatchUcnt');totalOnline+=kv(ki,'CurrentUserCnt');});
    return `<div class="region-card has-live"><div class="r-name"><span class="dot"></span>${city} <span style="font-size:10px;color:var(--sub);font-weight:400">(${liveCnt}间)</span></div><div class="r-data"><div class="d"><span class="dl">成交金额</span><span class="dv red">¥${fmtMoney(totalGmv)}</span></div><div class="d"><span class="dl">成交订单</span><span class="dv gold">${totalOrders}</span></div><div class="d"><span class="dl">累计观看</span><span class="dv">${fmt(totalWatch)}</span></div><div class="d"><span class="dl">实时在线</span><span class="dv blue">${totalOnline}</span></div></div></div>`;
  }).join('');
}
function renderRooms(rooms){
  const g=document.getElementById('roomList');
  if(!rooms.length){g.innerHTML='<div class="empty">当前无在播直播间</div>';return;}
  g.innerHTML=rooms.map(r=>{
    const meta=r.meta||{},live=r.live||{};const ri=live.room_info||{};
    const ki=Array.isArray(live.key_index)?live.key_index:[];const on=ri.is_life||ri.is_live;
    const online=kv(ki,'CurrentUserCnt'),gmvVal=gmv(ki),orders=kv(ki,'PayOrderCnt'),watch=kv(ki,'LiveServerWatchUcnt');
    const productCnt=live.product_cnt||0;const warns=[];
    if(productCnt===0)warns.push('未挂商品');
    if(!ri.qr_code)warns.push('无二维码');
    const rid=meta.room_id||'';
    const nick=meta.nickname||'';
    const isNumericNick=/^\d+$/.test(nick);
    const displayName=nick&&!isNumericNick?nick:(meta.unique_id?('ID:'+meta.unique_id):(nick||'未知'));
    return `<div class="room-card" onclick="selectRoom('${rid}')"><div class="top"><span class="name">${displayName}</span><span class="tag ${on?'on':'off'}">${on?'直播中':'未播'}</span></div><div class="metrics"><div class="m"><span class="ml">在线</span><span class="mv">${online}</span></div><div class="m"><span class="ml">观看</span><span class="mv">${watch}</span></div><div class="m"><span class="ml">成交</span><span class="mv">¥${gmvVal.toFixed(0)}</span></div><div class="m"><span class="ml">订单</span><span class="mv">${orders}</span></div><div class="m"><span class="ml">商品</span><span class="mv">${productCnt}</span></div><div class="m"><span class="ml">点赞</span><span class="mv">${fmt(num(meta.live_like_cnt_td))}</span></div></div>${warns.length?`<div class="warn">${warns.join(' · ')}</div>`:''}</div>`;
  }).join('');
}
function selectRoom(rid){document.querySelectorAll('.room-card').forEach(c=>c.classList.remove('active'));if(event&&event.currentTarget)event.currentTarget.classList.add('active');}
function renderAlerts(alerts){
  alertCount=alerts.length;
  const a=document.getElementById('alertList');
  if(!alerts.length){a.innerHTML='<div class="empty">暂无告警</div>';return;}
  a.innerHTML=alerts.map(al=>{
    const cls=al.level==='严重'?'sev':al.level==='警告'?'warn':'info';
    const alNick=al.nickname||'';
    const alDisplay=/^\d+$/.test(alNick)?('ID:'+alNick):alNick;
    return `<div class="alert ${cls}"><span class="lv">${al.level}</span><div class="desc"><b>${alDisplay||''}</b> · ${al.item||''}<br>${al.desc||''}<div class="time">${al.ts||''}</div></div></div>`;
  }).join('');
}
document.getElementById('regionTabs').addEventListener('click',e=>{
  if(e.target.tagName==='BUTTON'){
    document.querySelectorAll('#regionTabs button').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    currentMetric=e.target.dataset.metric;
    if(RAW_DATA&&RAW_DATA.cities){
      drawRegionChart(RAW_DATA.cities,currentMetric);
    }
  }
});
function tickCountdown(){countdownVal--;if(countdownVal<=0){countdownVal=30;loadData();loadAlerts();}document.getElementById('countdown').textContent=countdownVal;}
function start(){loadData();loadAlerts();setInterval(tickCountdown,1000);}
</script>
</body>
</html>
