# 抖本内容工坊 · SCF 自动部署（精简 CI）
# 触发：push 到 master，或在 Actions 页面手动触发（workflow_dispatch）
# 作用：仅自动部署 SCF（Web + Event），跳过前端（前端仍走本地 douyin-content-lab/deploy.mjs --quick）
#
# 首次使用需在仓库 Settings → Secrets and variables → Actions 添加以下 secrets：
#   TC_SECRET_ID   腾讯云 SecretId（douyin-personalize / douyin-update-hotspot 部署用）
#   TC_SECRET_KEY  腾讯云 SecretKey
#   GITEE_TOKEN    Gitee 私人令牌（推送 SCF 代码到 Gitee 供运行时自部署）
#   GH_TOKEN       GitHub PAT（预留，前端若后续也走 CI 时使用）
#
# 说明：本仓库根目录即部署脚本与 SCF 源码，CI 直接从根目录执行 node deploy-all.mjs --scf-only。
name: Deploy SCF (douyin-personalize + douyin-update-hotspot)

on:
  push:
    branches: [master]
  workflow_dispatch:

# 2026-08-21：排他锁根治 SCF 部署互撞（大屏数据更新等定时任务逐文件 push 会触发多个 Deploy SCF，
# 全部撞 UpdateFunctionCode 单函数锁）。同一时刻只允许一个 run 执行，新 push 取消旧 run，
# 最终部署态永远等于最新代码。
concurrency:
  group: deploy-scf-master
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-scf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy SCF (Web + Event)
        # 部署脚本内置 Timeout=180s 强制设置（防 AI 调用被 3s 默认超时掐断，2026-08-07 复盘）
        env:
          TC_SECRET_ID: ${{ secrets.TC_SECRET_ID }}
          TC_SECRET_KEY: ${{ secrets.TC_SECRET_KEY }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node deploy-all.mjs --scf-only

      - name: Cleanup redundant timers
        # 幂等清理：保留 daily-hotspot-warmup，删除其余 7 个冗余 timer；可重复运行，NotFound 忽略
        # if: always() —— 即使前面部署步骤因 Gitee 网络抖动失败，也照常清理定时器
        if: always()
        env:
          TC_SECRET_ID: ${{ secrets.TC_SECRET_ID }}
          TC_SECRET_KEY: ${{ secrets.TC_SECRET_KEY }}
        run: node cleanup-triggers.mjs
