name: Hotspot Raw Cache (全平台热搜候选 → Gitee)

# 背景：SCF（腾讯云数据中心出口）被 viki 非抖音路径 / imsyy CDN / 快手官方 WAF 风控，
#       Actions runner 出口不受限 → 每 3 小时抓全平台候选写 Gitee data/hotspot-raw.json，
#       SCF hotspot-fetch 优先读它（<12h）喂 AI 生成，回退 SCF 直连。
on:
  schedule:
    - cron: '20 */3 * * *'   # 每 3 小时（02:20/05:20/08:20/11:20/14:20/17:20/20:20/23:20 UTC）
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓取全平台热搜候选
        run: node scripts/fetch-hotspots-actions.mjs
      - name: 写入 Gitee 共享缓存
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: node scripts/gitee-put.mjs data/hotspot-raw.json
