<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山西电信抖本实时数据大屏</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
/* ========== CSS Design System (aligned with biz-dashboard) ========== */
:root {
  --bg: #f0f2f7;
  --surface: #fff;
  --bg-elevated: #EEF1F6;
  --primary: #0A5CDE;
  --primary-soft: #E8F1FD;
  --primary-hover: #084BB5;
  --text-1: #1e293b;
  --text-2: #475569;
  --text-3: #8b97a8;
  --green: #018B8D;
  --red: #C8161D;
  --orange: #E8A73C;
  --gold: #D4A017;
  --purple: #7a6fb8;
  --border-light: #E8E8E8;
  --border-default: #D0D5DD;
  --radius: 8px;
  --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(30,41,59,.04);
  --shadow-card: 0 1px 4px rgba(30,41,59,.06);
  --shadow-hover: 0 4px 12px rgba(10,92,222,.08);
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-7: 28px; --sp-8: 32px;
  --sidebar-w: 210px;
  --sidebar-w-collapse: 56px;
  --sidebar-bg: #1e293b;
  --sidebar-bg-hover: #334155;
  --sidebar-text: #cbd5e1;
  --sidebar-text-active: #fff;
  --sidebar-active-bg: #0A5CDE;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text-1); font-size: 14px; line-height: 1.5; }

/* ========== Password Lock ========== */
#lock { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 999; }
#lock .box { background: var(--surface); padding: var(--sp-8); border-radius: var(--radius-lg); text-align: center; box-shadow: var(--shadow-hover); border: 1px solid var(--border-light); }
#lock h2 { color: var(--primary); margin-bottom: var(--sp-4); font-size: 20px; letter-spacing: 2px; }
#lock input { padding: 10px 14px; width: 240px; border-radius: var(--radius); border: 1px solid var(--border-default); background: var(--bg); color: var(--text-1); font-size: 15px; text-align: center; outline: none; }
#lock input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(10,92,222,.1); }
#lock .btn { margin-top: var(--sp-3); padding: 9px 30px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius); font-size: 15px; cursor: pointer; transition: background .2s; }
#lock .btn:hover { background: var(--primary-hover); }
#lock .err { color: var(--red); margin-top: var(--sp-2); font-size: 12px; display: none; }
#dash { display: none; }

/* ========== Sidebar ========== */
#sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-w);
  background: var(--sidebar-bg); color: var(--sidebar-text);
  display: flex; flex-direction: column; z-index: 100;
  transition: width .25s ease; overflow-x: hidden;
}
#sidebar.collapsed { width: var(--sidebar-w-collapse); }
.sidebar-header { padding: 16px 12px; display: flex; align-items: center; gap: 8px; min-height: 52px; }
.sidebar-logo { width: 28px; height: 28px; background: var(--primary); border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px; font-weight: 700; color: #fff; }
.sidebar-title { font-size: 14px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; }
#sidebar.collapsed .sidebar-title { display: none; }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  cursor: pointer; color: var(--sidebar-text); white-space: nowrap;
  transition: background .15s; border-left: 3px solid transparent; font-size: 13px;
}
.nav-item:hover { background: var(--sidebar-bg-hover); }
.nav-item.active { color: var(--sidebar-text-active); background: var(--sidebar-active-bg); border-left-color: #60a5fa; }
.nav-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; }
.nav-label { overflow: hidden; }
#sidebar.collapsed .nav-label { display: none; }
.sidebar-footer { padding: 12px 16px; border-top: 1px solid #334155; }
#sidebar.collapsed .sidebar-footer { display: none; }
.collapse-btn { background: none; border: none; color: var(--sidebar-text); cursor: pointer; font-size: 18px; padding: 4px 8px; border-radius: 4px; }
.collapse-btn:hover { background: var(--sidebar-bg-hover); color: #fff; }

/* ========== Main Content ========== */
#main { margin-left: var(--sidebar-w); transition: margin-left .25s ease; min-height: 100vh; }
#sidebar.collapsed ~ #main { margin-left: var(--sidebar-w-collapse); }

/* Top Status Bar */
.status-bar {
  position: sticky; top: 0; z-index: 50;
  background: var(--surface); border-bottom: 1px solid var(--border-light);
  padding: 10px var(--sp-5); display: flex; align-items: center; justify-content: space-between;
  box-shadow: var(--shadow-sm);
}
.status-left { display: flex; align-items: center; gap: var(--sp-4); }
.status-title { font-size: 18px; font-weight: 700; color: var(--text-1); }
.status-right { display: flex; align-items: center; gap: var(--sp-4); }
.status-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; }
.dot-green { background: var(--green); animation: pulse 2s infinite; }
.dot-red { background: var(--red); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
.countdown-badge { background: var(--primary-soft); color: var(--primary); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.btn-toggle-all { padding: 5px 14px; font-size: 12px; background: var(--surface); border: 1px solid var(--border-default); color: var(--text-2); border-radius: var(--radius); cursor: pointer; transition: all .2s; }
.btn-toggle-all:hover { border-color: var(--primary); color: var(--primary); }

/* Content sections */
.content { padding: var(--sp-5); }
.section {
  background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
  margin-bottom: var(--sp-5); border: 1px solid var(--border-light); overflow: hidden;
  transition: box-shadow .2s;
}
.section:hover { box-shadow: var(--shadow-hover); }
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px; cursor: pointer; user-select: none; border-bottom: 1px solid var(--border-light);
  background: var(--bg-elevated);
}
.section-header:hover { background: #e6eaf0; }
.section-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text-1); }
.section-title .icon { font-size: 18px; }
.section-toggle { font-size: 12px; color: var(--text-3); transition: transform .2s; }
.section.collapsed .section-toggle { transform: rotate(-90deg); }
.section-body { padding: var(--sp-5); }
.section.collapsed .section-body { display: none; }

/* KPI Grid */
.kpi-grid { display: grid; gap: var(--sp-3); margin-bottom: var(--sp-4); }
.kpi-grid-6 { grid-template-columns: repeat(6, 1fr); }
.kpi-grid-5 { grid-template-columns: repeat(5, 1fr); }
.kpi-grid-4 { grid-template-columns: repeat(4, 1fr); }
.kpi-grid-3 { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 1400px) { .kpi-grid-6 { grid-template-columns: repeat(3, 1fr); } .kpi-grid-5 { grid-template-columns: repeat(3, 1fr); } }

.kpi-card {
  background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius);
  padding: var(--sp-4); position: relative; overflow: hidden; cursor: pointer;
  transition: transform .15s, box-shadow .15s;
}
.kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.kpi-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
.kpi-card.blue::before { background: var(--primary); }
.kpi-card.green::before { background: var(--green); }
.kpi-card.gold::before { background: var(--gold); }
.kpi-card.red::before { background: var(--red); }
.kpi-card.orange::before { background: var(--orange); }
.kpi-card.purple::before { background: var(--purple); }
.kpi-label { font-size: 12px; color: var(--text-3); margin-bottom: 6px; }
.kpi-value { font-size: 24px; font-weight: 700; color: var(--text-1); line-height: 1.2; }
.kpi-unit { font-size: 13px; font-weight: 400; color: var(--text-3); margin-left: 2px; }
.kpi-sub { font-size: 11px; color: var(--text-3); margin-top: 4px; }
.kpi-spark { height: 30px; margin-top: 8px; }

/* KPI Row Divider */
.kpi-divider { height: 1px; background: var(--border-light); margin: var(--sp-4) 0; position: relative; }
.kpi-divider::after { content: attr(data-label); position: absolute; left: 50%; top: -10px; transform: translateX(-50%); background: var(--surface); padding: 0 12px; font-size: 12px; color: var(--text-3); }

/* QA Module */
.qa-layout { display: grid; grid-template-columns: 1fr 360px; gap: var(--sp-4); }
@media (max-width: 1200px) { .qa-layout { grid-template-columns: 1fr; } }
.qa-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-3); margin-bottom: var(--sp-4); }
.qa-room-card {
  background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius);
  padding: var(--sp-3); cursor: pointer; transition: all .15s; position: relative;
}
.qa-room-card:hover { border-color: var(--primary); box-shadow: var(--shadow-hover); }
.qa-room-card.active { border-color: var(--primary); background: var(--primary-soft); }
.qa-room-card.alert-sev::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--red); border-radius: 3px 0 0 3px; }
.qa-room-card.alert-warn::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--orange); border-radius: 3px 0 0 3px; }
.qa-room-card.alert-info::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--primary); border-radius: 3px 0 0 3px; }
.room-name { font-size: 13px; font-weight: 600; color: var(--text-1); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room-metrics { display: flex; gap: var(--sp-3); flex-wrap: wrap; }
.room-metric { font-size: 11px; color: var(--text-2); }
.room-metric b { color: var(--text-1); font-size: 13px; }
.room-metric .lbl { color: var(--text-3); }
.live-badge { display: inline-block; background: var(--green); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 4px; }
.live-badge.offline { background: var(--text-3); }

.alert-list { max-height: 400px; overflow-y: auto; }
.alert-item { display: flex; align-items: start; gap: 8px; padding: 10px 12px; border-radius: var(--radius); margin-bottom: 6px; font-size: 12px; }
.alert-item.sev { background: #fef2f2; border-left: 3px solid var(--red); }
.alert-item.warn { background: #fffbeb; border-left: 3px solid var(--orange); }
.alert-item.info { background: var(--primary-soft); border-left: 3px solid var(--primary); }
.alert-level { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 3px; flex-shrink: 0; }
.alert-level.sev { background: var(--red); color: #fff; }
.alert-level.warn { background: var(--orange); color: #fff; }
.alert-level.info { background: var(--primary); color: #fff; }
.alert-content { flex: 1; }
.alert-desc { color: var(--text-1); font-weight: 500; }
.alert-nick { color: var(--text-3); font-size: 11px; margin-top: 2px; }

/* Region */
.region-tabs { display: flex; gap: 6px; margin-bottom: var(--sp-4); flex-wrap: wrap; }
.region-tab {
  padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer;
  background: var(--bg-elevated); color: var(--text-2); border: 1px solid var(--border-light);
  transition: all .15s;
}
.region-tab:hover { border-color: var(--primary); }
.region-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.region-chart-container { height: 320px; margin-bottom: var(--sp-4); }

/* Table */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { background: var(--bg-elevated); padding: 10px 12px; text-align: center; font-weight: 600; color: var(--text-2); position: sticky; top: 0; cursor: pointer; white-space: nowrap; }
.data-table th:hover { background: #e0e5ee; }
.data-table th.sort-asc::after { content: ' \2191'; color: var(--primary); }
.data-table th.sort-desc::after { content: ' \2193'; color: var(--primary); }
.data-table td { padding: 8px 12px; text-align: center; color: var(--text-2); border-bottom: 1px solid var(--border-light); }
.data-table tr:hover { background: var(--primary-soft); }
.table-wrap { max-height: 520px; overflow-y: auto; border-radius: var(--radius); border: 1px solid var(--border-light); }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(30,41,59,.5); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--surface); border-radius: var(--radius-lg); max-width: 94vw; max-height: 92vh;
  width: 1000px; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3);
  animation: modalIn .25s ease;
}
@keyframes modalIn { from { opacity: 0; transform: scale(.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border-light); position: sticky; top: 0; background: var(--surface); z-index: 10; }
.modal-title { font-size: 18px; font-weight: 700; color: var(--text-1); display: flex; align-items: center; gap: 8px; }
.modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-3); padding: 4px 8px; border-radius: 4px; }
.modal-close:hover { background: var(--bg-elevated); color: var(--text-1); }
.modal-body { padding: 24px; }

/* Modal charts grid */
.modal-kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-3); margin-bottom: var(--sp-4); }
@media (max-width: 800px) { .modal-kpi-grid { grid-template-columns: repeat(2, 1fr); } }
.modal-chart-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--sp-4); margin-bottom: var(--sp-4); }
@media (max-width: 800px) { .modal-chart-row { grid-template-columns: 1fr; } }
.chart-box { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius); padding: var(--sp-3); }
.chart-box-title { font-size: 13px; font-weight: 600; color: var(--text-1); margin-bottom: 8px; }
.chart-box canvas, .chart-box > div { width: 100% !important; }

/* Comment stream */
.comment-stream { max-height: 300px; overflow-y: auto; }
.comment-item { display: flex; gap: 8px; padding: 8px; border-bottom: 1px solid var(--border-light); }
.comment-avatar { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; object-fit: cover; }
.comment-body { flex: 1; }
.comment-nick { font-size: 12px; color: var(--text-3); }
.comment-text { font-size: 13px; color: var(--text-1); }

/* Toast */
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 300; }
.toast { background: var(--surface); border-radius: var(--radius); padding: 12px 20px; margin-bottom: 8px; box-shadow: var(--shadow-hover); font-size: 13px; display: flex; align-items: center; gap: 8px; animation: toastIn .3s ease; border-left: 3px solid var(--green); }
.toast.error { border-left-color: var(--red); }
.toast.info { border-left-color: var(--primary); }
@keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

/* Product table in modal */
.product-img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; }

/* Misc */
.loading { text-align: center; padding: 40px; color: var(--text-3); }
.error-msg { text-align: center; padding: 40px; color: var(--red); }
.tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
.tag-green { background: #e6f7f0; color: var(--green); }
.tag-red { background: #fef2f2; color: var(--red); }
.tag-blue { background: var(--primary-soft); color: var(--primary); }

footer { padding: var(--sp-3); text-align: center; color: var(--text-3); font-size: 10px; }

.scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
.scrollbar::-webkit-scrollbar-track { background: transparent; }
.scrollbar::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }
.scrollbar::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
</style>
</head>
<body>

<!-- ========== Password Lock ========== -->
<div id="lock">
  <div class="box">
    <h2>山西电信直播数据大屏</h2>
    <input id="pwd" type="password" placeholder="请输入访问密码" autocomplete="off">
    <div><button class="btn" onclick="checkPwd()">进入</button></div>
    <div class="err" id="err">密码错误，请重试</div>
  </div>
</div>

<div id="dash">
<!-- ========== Sidebar ========== -->
<div id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">抖</div>
    <span class="sidebar-title">抖本数据大屏</span>
  </div>
  <div class="sidebar-nav">
    <div class="nav-item active" data-target="sec-flow" onclick="navTo('sec-flow')">
      <span class="nav-icon">📊</span><span class="nav-label">实时流量</span>
    </div>
    <div class="nav-item" data-target="sec-summary" onclick="navTo('sec-summary')">
      <span class="nav-icon">📋</span><span class="nav-label">经营总览</span>
    </div>
    <div class="nav-item" data-target="sec-qa" onclick="navTo('sec-qa')">
      <span class="nav-icon">🛡</span><span class="nav-label">直播质检</span>
    </div>
    <div class="nav-item" data-target="sec-region" onclick="navTo('sec-region')">
      <span class="nav-icon">🗺</span><span class="nav-label">地市排行</span>
    </div>
    <div class="nav-item" data-target="sec-room-city" onclick="navTo('sec-room-city')">
      <span class="nav-icon">📡</span><span class="nav-label">直播间地市</span>
    </div>
  </div>
  <div class="sidebar-footer">
    <button class="collapse-btn" onclick="toggleSidebar()">◀</button>
  </div>
</div>

<!-- ========== Main Content ========== -->
<div id="main">
  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-left">
      <span class="status-title">山西团队抖本实时数据大屏</span>
      <span class="status-item"><span class="status-dot dot-green"></span>数据同步中</span>
    </div>
    <div class="status-right">
      <span class="status-item" id="lastUpdate">更新时间: --</span>
      <span class="status-item"><span class="status-dot dot-green" id="livingDot"></span>在播: <b id="livingCnt">--</b></span>
      <span class="countdown-badge">刷新倒计时 <span id="countdown">60</span>s</span>
      <button class="btn-toggle-all" id="btnToggleAll" onclick="toggleAllSections()">全部收起</button>
    </div>
  </div>

  <div class="content">
    <!-- Section 1: Flow Realtime -->
    <div class="section" id="sec-flow">
      <div class="section-header" onclick="toggleSection(this)">
        <div class="section-title"><span class="icon">📊</span>直播间实时流量</div>
        <span class="section-toggle">▼</span>
      </div>
      <div class="section-body">
        <div class="kpi-grid kpi-grid-6" id="flowGrid"></div>
      </div>
    </div>

    <!-- Section 2: Summary -->
    <div class="section" id="sec-summary">
      <div class="section-header" onclick="toggleSection(this)">
        <div class="section-title"><span class="icon">📋</span>经营数据总览</div>
        <span class="section-toggle">▼</span>
      </div>
      <div class="section-body">
        <div class="kpi-grid kpi-grid-6" id="kpiGridRt"></div>
        <div class="kpi-divider" data-label="月累计数据"></div>
        <div class="kpi-grid" style="grid-template-columns: repeat(9,1fr)" id="kpiGridMo"></div>
      </div>
    </div>

    <!-- Section 3: QA -->
    <div class="section" id="sec-qa">
      <div class="section-header" onclick="toggleSection(this)">
        <div class="section-title"><span class="icon">🛡</span>直播质检看板</div>
        <span class="section-toggle">▼</span>
      </div>
      <div class="section-body">
        <div class="qa-summary" id="qaSummary"></div>
        <div class="qa-layout">
          <div>
            <div style="font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text-1)">在播直播间</div>
            <div class="kpi-grid kpi-grid-3" id="roomList"></div>
          </div>
          <div>
            <div style="font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text-1)">告警列表</div>
            <div class="alert-list scrollbar" id="alertList"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Section 4: Region -->
    <div class="section" id="sec-region">
      <div class="section-header" onclick="toggleSection(this)">
        <div class="section-title"><span class="icon">🗺</span>地市经营排行</div>
        <span class="section-toggle">▼</span>
      </div>
      <div class="section-body">
        <div class="region-tabs" id="regionTabs"></div>
        <div class="region-chart-container" id="regionChart"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="chart-box">
            <div class="chart-box-title">地市成交额占比</div>
            <div id="regionPie" style="height:280px"></div>
          </div>
          <div class="chart-box">
