name: Hotspot Daily (每日热点脚本 5 条 → Gitee)

# 背景：v2.9.80 热点卡改为「每天 5 条纯热点脚本」。
#       前端 autoRefresh 先读 SCF hotspot-cache（Gitee data/hotspot-latest.json），新鲜则秒级展示。
#       本 workflow 每天定时调 SCF hotspot-fetch 生成 5 条并持久化，保证用户打开站点即有当日 5 条，
#       不依赖用户访问才生成。SCF 端 prompt 已强制 lane=hot 5 条。
on:
  schedule:
    - cron: '30 22 * * *'   # 每天 22:30 UTC = 次日 06:30 北京时间，营业厅上班前备好当日 5 条
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 调 SCF hotspot-fetch 生成 5 条热点脚本
        env:
          SCF_URL: https://1253338744-6kei9ayy45.ap-guangzhou.tencentscf.com
        run: |
          curl -sS -X POST "$SCF_URL" \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{"mode":"hotspot-fetch","model":"MiniMax-M2.7","max_tokens":10000,"temperature":0.9}' \
            -o /tmp/hotspot-fetch.json -w "HTTP %{http_code}\n" --max-time 240
          node -e "
            const j = require('/tmp/hotspot-fetch.json');
            if (!j.ok || !Array.isArray(j.scripts)) { console.error('❌ hotspot-fetch 失败:', JSON.stringify(j).slice(0, 300)); process.exit(1); }
            const hot = j.scripts.filter(s => s.lane === 'hot');
            console.log('✅ 生成 ' + j.scripts.length + ' 条，其中 hot ' + hot.length + ' 条');
            hot.slice(0, 5).forEach((s, i) => console.log('  [' + (i+1) + '] ' + s.platform + ' | ' + (s.title || '').slice(0, 36)));
            if (hot.length < 5) { console.error('❌ hot 条数不足 5（实际 ' + hot.length + '），需人工检查'); process.exit(1); }
          "
